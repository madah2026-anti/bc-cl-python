<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BC ERP – إنشاء حساب جديد">
  <title>BC ERP – إنشاء حساب</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="brand-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/>
            <polyline points="17 11 19 13 23 9"/>
          </svg>
          حساب جديد
        </div>
        <h1>إنشاء حساب</h1>
        <p>سجّل مستخدم جديد في النظام</p>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <form action="/register" method="POST" id="registerForm">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" name="username" class="form-input"
                 placeholder="اختر اسم مستخدم فريد" required autofocus minlength="3" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="أنشئ كلمة مرور قوية" required minlength="4" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                 placeholder="أعد إدخال كلمة المرور" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary">إنشاء الحساب</button>
      </form>

      <div class="auth-footer">
        <p>لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a></p>
      </div>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alert-box');
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('error')) {
      alertBox.className = 'alert alert-danger';
      alertBox.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>${decodeURIComponent(urlParams.get('error'))}</span>`;
      alertBox.style.display = 'flex';
    }

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      if (pw !== cpw) {
        e.preventDefault();
        alertBox.className = 'alert alert-danger';
        alertBox.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>كلمتا المرور غير متطابقتين</span>`;
        alertBox.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
