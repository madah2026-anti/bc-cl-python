<!-- ═══ Warehouse Add/Edit Modal ═══ -->
<div class="modal-overlay" id="warehouseModalOverlay">
  <div class="modal" id="warehouseModal">
    <div class="modal-header">
      <h3 id="warehouseModalTitle">إضافة مستودع جديد</h3>
      <button class="modal-close" id="warehouseModalClose" aria-label="إغلاق">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <form id="warehouseForm">
      <input type="hidden" id="whEditId" value="">

      <div class="modal-body">
        <div class="form-row">
          <!-- كود المخزن -->
          <div class="form-group">
            <label for="whCode">كود المخزن <span class="required">*</span></label>
            <input type="text" id="whCode" class="form-input" placeholder="WH-001" required>
          </div>
          <!-- اسم المخزن -->
          <div class="form-group">
            <label for="whName">اسم المخزن <span class="required">*</span></label>
            <input type="text" id="whName" class="form-input" placeholder="المستودع الرئيسي" required>
          </div>
        </div>

        <div class="form-row">
          <!-- أمن المستودع / المسؤول -->
          <div class="form-group">
            <label for="whManager">أمين المستودع</label>
            <input type="text" id="whManager" class="form-input" placeholder="اسم المسؤول">
          </div>
          <!-- رقم التواصل -->
          <div class="form-group">
            <label for="whPhone">رقم التواصل</label>
            <input type="text" id="whPhone" class="form-input" placeholder="0501234567" dir="ltr">
          </div>
        </div>

        <!-- الموقع / العنوان -->
        <div class="form-group">
          <label for="whLocation">الموقع / العنوان</label>
          <input type="text" id="whLocation" class="form-input" placeholder="الرياض - المنطقة الصناعية">
        </div>

        <!-- الحالة (نشط) -->
        <div class="form-group" style="display:flex; align-items:center; gap:10px; margin-top:8px;">
          <input type="checkbox" id="whIsActive" checked style="width:18px; height:18px; cursor:pointer;">
          <label for="whIsActive" style="margin:0; cursor:pointer;">المستودع نشط ومفعل</label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" id="warehouseModalCancel">إلغاء</button>
        <button type="submit" class="btn-primary btn-save" id="warehouseSaveBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
          حفظ
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Delete Warehouse Modal ═══ -->
<div class="modal-overlay" id="deleteWhModalOverlay">
  <div class="modal modal-sm">
    <div class="modal-header modal-header-danger">
      <h3>تأكيد حذف المستودع</h3>
    </div>
    <div class="modal-body">
      <p class="delete-msg">هل أنت متأكد من حذف المستودع <strong id="deleteWhName"></strong>؟</p>
      <p class="delete-warning">لا يمكن التراجع عن هذا الإجراء.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="deleteWhCancelBtn">إلغاء</button>
      <button class="btn-danger" id="deleteWhConfirmBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
        حذف
      </button>
    </div>
  </div>
</div>
