<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BC ERP – نظام تخطيط موارد المؤسسات">
  <title>BC ERP – تسجيل الدخول</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="brand-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          BC ERP SYSTEM
        </div>
        <h1>مرحباً بعودتك</h1>
        <p>سجّل دخولك للوصول إلى لوحة التحكم</p>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <form action="/login" method="POST" id="loginForm">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" name="username" class="form-input"
                 placeholder="أدخل اسم المستخدم" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">تسجيل الدخول</button>
      </form>

      <div class="auth-footer">
        <p>ليس لديك حساب؟ <a href="/register">إنشاء حساب جديد</a></p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alert-box');

    if (urlParams.has('error')) {
      alertBox.className = 'alert alert-danger';
      alertBox.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>${decodeURIComponent(urlParams.get('error'))}</span>`;
      alertBox.style.display = 'flex';
    } else if (urlParams.has('success')) {
      alertBox.className = 'alert alert-success';
      alertBox.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>${decodeURIComponent(urlParams.get('success'))}</span>`;
      alertBox.style.display = 'flex';
    }
  </script>
</body>
</html>
